name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # next.config ignores TypeScript errors at build time (ignoreBuildErrors); report only.
      - run: npx tsc --noEmit || true
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: densify
          POSTGRES_PASSWORD: densify
          POSTGRES_DB: densify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U densify" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://densify:densify@localhost:5432/densify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: Apply schema
        run: sudo apt-get install -y postgresql-client && sh ../db/apply-schema.sh
      - name: Unit + DB tests (LLM and S3 mocked)
        run: pytest

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/terraform
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/densify -f deploy/helm/densify/values-prod.yaml --strict

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t densify-api:ci backend
      - run: docker build -t densify-schema:ci db
      - run: docker build -t densify-web:ci frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (postgres + S3 + api + web)
        run: docker compose up -d --build --wait web api
      # Same Playwright image as local runs, so screenshot baselines match.
      - name: Playwright (compose e2e service)
        run: docker compose --profile e2e run --rm --no-deps e2e --project=desktop
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
