[pytest]
testpaths = tests
pythonpath = .
addopts = --tb=short --strict-markers -v --color=yes
markers =
    auth: OTP, login pre-check, password reset
    checkin: daily check-in upsert/time-zone logic
    s3_bedrock: object storage + LLM pipeline (LLM mocked)
    telemetry: dashboard telemetry math
    guardrails: error/security guardrails
    schema: database schema & constraints
    slow: slower concurrency tests
timeout = 180
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s  [%(levelname)-8s]  %(name)s  —  %(message)s
log_cli_date_format = %H:%M:%S
