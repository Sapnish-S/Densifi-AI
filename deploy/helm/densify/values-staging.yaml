hosts:
  app: app-staging.densify.example
  api: api-staging.densify.example
web:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPU: 70 }
  pdb: { minAvailable: 0 }
  env:
    BETTER_AUTH_URL: https://app-staging.densify.example
    TRUSTED_ORIGINS: https://app-staging.densify.example
    S3_BUCKET: densify-vault-storage-staging
    S3_PUBLIC_BASE_URL: https://densify-vault-storage-staging.us-ord-10.linodeobjects.com
api:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPU: 70 }
  pdb: { minAvailable: 0 }
  env:
    CORS_ALLOW_ORIGINS: https://app-staging.densify.example
    S3_BUCKET: densify-vault-storage-staging
existingSecret: densify-staging
